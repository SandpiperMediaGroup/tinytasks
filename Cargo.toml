[package]
name = "tinytasks"
version = "0.3.2"
edition = "2021"
description = "A sticky-note task list your AI agents can write to (via MCP), kept in a markdown file."
license = "MIT"
repository = "https://github.com/SandpiperMediaGroup/tinytasks"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
semver = "1"
dirs = "6"
open = "5"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
winreg = "0.56"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant",
  "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
