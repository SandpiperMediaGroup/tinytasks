<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyTasks</title>
<script src="themes.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="note-handle" hidden title="Drag to move note">
    <div id="note-complete"></div>
    <button id="close-note" class="icon" tabindex="0" aria-label="Close sticky note" title="Close note"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </div>
  <header data-tauri-drag-region="deep">
    <div class="menu-wrap">
      <h1><button id="view" class="view-btn" title="Choose what to show" aria-haspopup="menu" aria-expanded="false">
        <span id="heading-icon" hidden></span><span id="heading">Tasks</span><span id="count"></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
      </button></h1>
      <div id="view-menu" data-tauri-drag-region="false" class="menu" role="menu" hidden>
        <button role="menuitemradio" data-view="all"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>All <span class="n"></span></button>
        <button role="menuitemradio" data-view="desk">My Desk <span class="n"></span></button>
        <button role="menuitemradio" data-view="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Completed <span class="n"></span></button>
        <button role="menuitemradio" data-view="today">Today <span class="n"></span></button>
        <button role="menuitemradio" data-view="upcoming">Upcoming <span class="n"></span></button>
        <div class="menu-sep"></div>
        <button id="sidebar-toggle" role="menuitemcheckbox" aria-checked="false">Show sidebar</button>
        <div class="menu-sep"></div>
        <div class="menu-label">Task location</div>
        <div id="where"></div>
        <button id="change-folder" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Change folder…</button>
        <button id="open-file" role="menuitem"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/></svg>Open tasks.md</button>
        <div class="menu-sep"></div>
        <button id="settings-open" role="menuitem"><svg viewBox="0 0 24 24"><path d="m9 3-.6 2.4-2.1 1.2L4 6l-2 3.5 1.7 1.8v1.4L2 14.5 4 18l2.3-.6 2.1 1.2L9 21h6l.6-2.4 2.1-1.2 2.3.6 2-3.5-1.7-1.8v-1.4L22 9.5 20 6l-2.3.6-2.1-1.2L15 3z"/><circle cx="12" cy="12" r="3"/></svg>Settings</button>
      </div>
    </div>
    <div class="tools">
      <button id="add" class="icon" title="Add a task">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="menu-wrap">
        <button id="group" class="icon" title="Grouping and ordering" aria-label="Grouping and ordering" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3zM3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
        </button>
        <div id="group-menu" data-tauri-drag-region="false" class="menu" role="dialog" aria-label="Grouping and ordering" hidden>
          <div class="layout-setting">
            <label for="group-field">Grouping</label>
            <button id="group-direction" class="direction" aria-label="Reverse group order"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sort-arrow" d="M6 19V5m-3 3 3-3 3 3"/><path d="M13 6h3M13 12h5M13 18h8"/></svg></button>
            <button id="group-field" class="layout-picker" aria-haspopup="menu" aria-expanded="false" aria-controls="layout-options"><span class="choice-label"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
          <div class="layout-setting">
            <label for="order-field">Ordering</label>
            <button id="order-direction" class="direction" aria-label="Reverse task order"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="sort-arrow" d="M6 19V5m-3 3 3-3 3 3"/><path d="M13 6h3M13 12h5M13 18h8"/></svg></button>
            <button id="order-field" class="layout-picker" aria-haspopup="menu" aria-expanded="false" aria-controls="layout-options"><span class="choice-label"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
          <div id="layout-options" class="menu floating" role="menu" hidden></div>
        </div>
      </div>
      <div class="menu-wrap">
        <button id="display" class="icon" title="Display properties" aria-label="Display properties" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h4M12 7h8M4 17h8M16 17h4M8 4v6M16 14v6"/></svg>
        </button>
        <div id="display-menu" data-tauri-drag-region="false" class="menu" role="dialog" aria-label="Display properties" hidden>
          <div class="menu-label">Display properties</div>
          <div class="property-options">
            <button data-property="id" aria-pressed="false">ID</button>
            <button data-property="agent" aria-pressed="true">Agent</button>
            <button data-property="chat" aria-pressed="true">Lists &amp; Chats</button>
            <button data-property="priority" aria-pressed="true">Priority</button>
            <button data-property="due" aria-pressed="true">Due date</button>
            <button data-property="added" aria-pressed="true">Added</button>
            <button data-property="completed" aria-pressed="true">Completed</button>
            <button data-property="subtasks" aria-pressed="true">Subtask count</button>
            <button data-property="details" aria-pressed="false">Details</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div id="release-notice" role="status" hidden><button id="release-download"></button></div>
  <p id="notice" role="status" hidden></p>
  <div id="workspace">
    <aside id="sidebar" aria-label="Navigation" hidden>
      <nav id="primary-nav" aria-label="Views"></nav>
      <div class="menu-sep"></div>
      <div class="sidebar-heading"><span>Lists &amp; Chats</span><button id="add-list" class="icon" aria-label="New list" title="New list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <nav id="list-nav" aria-label="Lists &amp; Chats"></nav>
      <form id="new-list" hidden autocomplete="off"><input id="new-list-name" maxlength="200" placeholder="List name" aria-label="New list name"></form>
      <div id="sidebar-space" title="Double-click to create a list"></div>
    </aside>
    <div id="sidebar-resizer" role="separator" aria-label="Sidebar width" aria-orientation="vertical" aria-valuemin="140" aria-valuemax="400" aria-valuenow="220" tabindex="0" hidden></div>
  <main id="main">
    <div id="desk-head" hidden>
      <div id="desk-timeline" role="group" hidden>
        <span class="timeline-lamp desk-lamp" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="lamp-shade" d="M8 3h8l3.5 8h-15L8 3z"/><path d="M12 11v9M8 20h8"/></svg></span>
        <div id="desk-hours" aria-hidden="true"></div>
        <div class="desk-track" id="desk-track">
          <div id="desk-markers"></div>
          <span id="desk-drop-preview" hidden><span id="desk-drop-time"></span></span>
        </div>
        <span id="desk-now" aria-hidden="true"></span>
      </div>
      <div id="desk-review" hidden>
        <span id="desk-proposal-label"></span>
        <div class="desk-review-actions"><button id="desk-decline">Decline</button><button id="desk-accept">✓ Accept</button></div>
      </div>
      <p id="desk-error" role="alert" hidden></p>
    </div>
    <form id="new-task" hidden autocomplete="off">
      <span class="check"></span>
      <textarea id="new-title" rows="1" maxlength="300" placeholder="Add a task" aria-label="New task"></textarea>
    </form>
    <div id="open"></div>
    <p id="empty" hidden>All clear.</p>
    <div id="problem" hidden>
      <p></p>
      <button class="pick-folder">Choose a folder…</button>
    </div>
  </main>
  </div>

  <div id="desk-time-dialog" class="menu floating desk-time-popover" role="dialog" aria-labelledby="desk-time-heading" hidden>
    <h2 id="desk-time-heading" class="desk-picker-heading">Desk time</h2>
    <div class="desk-arc-area" role="group" aria-label="Drag endpoints to resize, or the arc to move the time block">
      <div class="desk-arc-face" aria-hidden="true"></div>
      <svg class="desk-arc-scale" viewBox="0 0 260 260" role="img" aria-label="Twelve-hour time dial"><g class="desk-arc-marks"></g><circle class="desk-arc-track" cx="130" cy="130" r="99"></circle><path class="desk-arc-selection"></path></svg>
      <button type="button" class="desk-arc-handle" data-arc-part="start" role="slider" aria-label="Start time"><span class="desk-arc-cap"></span></button>
      <button type="button" class="desk-arc-handle" data-arc-part="end" role="slider" aria-label="End time"><span class="desk-arc-cap"></span></button>
      <button type="button" class="desk-arc-handle" data-arc-part="move" role="slider" aria-label="Move time block"><span class="desk-arc-grip"><i></i><i></i><i></i></span></button>
      <div class="desk-arc-readout">
        <div class="desk-arc-time-line"><span class="desk-arc-start-time" aria-hidden="true"></span><span class="desk-arc-start-unit" aria-hidden="true"></span></div>
        <div class="desk-arc-time-line"><span class="desk-arc-end-time" aria-hidden="true"></span><span class="desk-arc-end-unit" aria-hidden="true"></span></div>
        <span class="desk-arc-duration" aria-hidden="true"></span>
      </div>
    </div>
    <button type="button" class="desk-arc-clear" aria-label="Clear time" title="Clear time" hidden><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
    <p id="desk-time-error" class="desk-arc-error" role="alert" hidden></p>
    <button type="button" class="desk-arc-retry" hidden>Retry</button>
    <span class="desk-arc-live desk-picker-heading" aria-live="polite"></span>
  </div>

  <div id="task-menu" class="menu floating" role="menu" aria-label="Task actions" hidden>
    <button class="open-note" data-action="open-note" role="menuitem"><svg viewBox="0 0 24 24"><path d="M16 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11z"/><path d="M16 21v-5h5"/></svg><span>Open as sticky note</span></button>
    <button class="first-subtask" data-action="first-subtask" role="menuitem"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Add subtask</span></button>
    <button class="set-desk" data-action="set-desk" role="menuitem"><svg viewBox="0 0 24 24"><path d="M8 3h8l3.5 8h-15L8 3zM12 11v9M8 20h8"/></svg><span>Put on my desk</span></button>
    <button class="set-due" data-action="set-due" role="menuitem" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><span>Due date</span></button>
    <button data-action="set-desk-time" role="menuitem" aria-haspopup="dialog" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Desk time</span></button>
    <button class="set-prio" data-action="set-prio" role="menuitem" aria-haspopup="menu"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Priority</span></button>
    <button data-action="set-chat" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v11H3zM14 4h7m-3-3 3 3-3 3"/></svg><span>Move to list…</span></button>
    <button class="open-link" data-action="open-link" role="menuitem"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>Open link</span></button>
    <button class="delete" data-action="delete" role="menuitem"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg><span>Delete task</span></button>
  </div>

  <form id="attribute-menu" class="menu floating" role="dialog" aria-label="New list" hidden autocomplete="off">
    <label id="attribute-label" for="attribute-value">New list</label>
    <input id="attribute-value" maxlength="200">
    <div class="attribute-actions"><button type="button" id="attribute-cancel">Cancel</button><button type="submit">Save</button></div>
  </form>
  <div id="list-menu" class="menu floating" role="menu" aria-label="Move to list" hidden></div>
  <div id="sidebar-menu" class="menu floating" role="menu" aria-label="List actions" hidden>
    <button data-list-action="rename" role="menuitem">Rename…</button>
    <button data-list-action="icon" role="menuitem">Change icon…</button>
    <div class="menu-sep"></div>
    <button data-list-action="up" role="menuitem">Move up</button>
    <button data-list-action="down" role="menuitem">Move down</button>
    <div class="menu-sep"></div>
    <button data-list-action="archive" role="menuitem">Archive list</button>
    <button data-list-action="delete" class="delete" role="menuitem">Delete list…</button>
  </div>
  <dialog id="list-dialog" aria-labelledby="list-dialog-title">
    <form id="list-dialog-form">
      <h2 id="list-dialog-title"></h2>
      <p id="list-dialog-description"></p>
      <label id="list-name-label" for="list-name">List name</label>
      <input id="list-name" maxlength="200" autocomplete="off">
      <p id="list-dialog-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" id="list-dialog-cancel">Cancel</button><button type="submit" id="list-dialog-save">Save</button></div>
    </form>
  </dialog>
  <div id="list-icon-menu" class="menu floating" role="dialog" aria-label="List icon" hidden>
    <div class="icon-picker-head"><div class="menu-label">List icon</div><div id="list-icon-agent"></div></div>
    <div id="list-icon-options" role="group" aria-label="List symbols"></div>
  </div>

  <div id="prio-menu" class="menu floating" role="menu" hidden>
    <div class="menu-label">Priority</div>
    <button role="menuitemradio" data-p="0"><span class="prio" data-p="0">P0</span>Drop everything</button>
    <button role="menuitemradio" data-p="1"><span class="prio" data-p="1">P1</span>Today</button>
    <button role="menuitemradio" data-p="2"><span class="prio" data-p="2">P2</span>Soon</button>
    <button role="menuitemradio" data-p="3"><span class="prio" data-p="3">P3</span>Whenever</button>
    <button role="menuitemradio" data-p="">None</button>
  </div>

  <div id="due-menu" class="menu floating" role="dialog" aria-label="Due date" hidden>
    <div class="cal-head">
      <button class="icon" data-nav="-1" title="Previous month"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <span id="cal-title"></span>
      <button class="icon" data-nav="1" title="Next month"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div id="cal-grid"></div>
    <div class="cal-quick">
      <button data-quick="0">Today</button>
      <button data-quick="1">Tomorrow</button>
      <button data-quick="clear">Clear</button>
    </div>
  </div>



  <template id="row">
    <li class="task">
      <div class="line">
        <button class="check" title="Mark done"><svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></button>
        <div class="text">
          <div class="title"><span class="title-text" role="button" tabindex="0" aria-label="Edit task title"></span></div>
          <div class="parent-context" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 10-4-4 4-4M5 6h8a6 6 0 0 1 6 6v8"/></svg><span></span></div>
          <div class="preview" hidden></div>
          <div class="sub"><span class="task-id" hidden></span><span class="src"></span><span class="due" hidden><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><span></span></span><span class="time-sub"></span></div>
        </div>
        <div class="row-status">
          <button class="subtask-count" hidden></button><span class="prio" hidden></span>
          <button class="icon details-indicator" aria-label="Task details" title="Task details" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c4-4 12-4 11-1S4 12 5 14s13-6 14-3-9 6-7 8c1 1 4 0 7-1"/></svg></button>
          <span class="time"></span>
          <button class="icon more" aria-label="Task actions" title="Task actions" aria-haspopup="menu" aria-controls="task-menu" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
        </div>
      </div>
      <div class="details">
        <div class="details-inner">
          <div class="details-pad">
            <p class="body" role="button" tabindex="0" aria-label="Edit task details"></p>
            <div class="subtasks" hidden>
              <div class="subtasks-head">
                <span>Subtasks</span>
                <button class="mode-chip" aria-label="Ordered subtasks" aria-pressed="false"><span class="mode-number">1</span><span class="slash">/</span><span class="mode-dot">•</span></button>
                <button class="icon add-subtask" title="Add subtask" aria-label="Add subtask"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
              </div>
              <ul class="subtask-list"></ul>
            </div>

          </div>
        </div>
      </div>
    </li>
  </template>

  <script src="agents.js"></script>
  <script src="icons.js"></script>
  <script src="desk-arc.js"></script>
  <script src="desk.js"></script>
  <script src="app.js"></script>
</body>
</html>
