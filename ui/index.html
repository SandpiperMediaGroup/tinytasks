<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinyTasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="note-handle" hidden title="Drag to move note">
    <button id="close-note" class="icon" tabindex="0" aria-label="Close sticky note" title="Close note"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </div>
  <header>
    <div class="menu-wrap">
      <h1><button id="view" class="view-btn" title="Choose what to show" aria-haspopup="menu" aria-expanded="false">
        <span id="heading">Tasks</span><span id="count"></span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg>
      </button></h1>
      <div id="view-menu" class="menu" role="menu" hidden>
        <button role="menuitemradio" data-view="all"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Tasks <span class="n"></span></button>
        <button role="menuitemradio" data-view="desk"><svg viewBox="0 0 24 24"><path d="M8 3h8l3.5 8h-15L8 3zM12 11v9M8 20h8"/></svg>My desk <span class="n"></span></button>
        <button role="menuitemradio" data-view="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Completed <span class="n"></span></button>
        <div class="menu-sep"></div>
        <div class="menu-label">Task location</div>
        <div id="where"></div>
        <button id="change-folder" role="menuitem"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Change folder…</button>
        <button id="open-file" role="menuitem"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M9 13h6M9 17h4"/></svg>Open tasks.md</button>
      </div>
    </div>
    <div class="tools">
      <button id="add" class="icon" title="Add a task">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="menu-wrap">
        <button id="group" class="icon" title="Group by" aria-haspopup="menu" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3zM3 12l9 4.5 9-4.5M3 16.5 12 21l9-4.5"/></svg>
        </button>
        <div id="group-menu" class="menu" role="menu" hidden>
          <div class="menu-label">Group by</div>
          <button role="menuitemradio" data-group="time">Time added</button>
          <button role="menuitemradio" data-group="chat">Chat</button>
          <button role="menuitemradio" data-group="agent">Agent</button>
          <button role="menuitemradio" data-group="priority">Priority</button>
          <button role="menuitemradio" data-group="due">Due date</button>
        </div>
      </div>
      <div class="menu-wrap">
        <button id="display" class="icon" title="Display properties" aria-label="Display properties" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 7h4M12 7h8M4 17h8M16 17h4M8 4v6M16 14v6"/></svg>
        </button>
        <div id="display-menu" class="menu" role="dialog" aria-label="Display properties" hidden>
          <div class="menu-label">Display properties</div>
          <div class="property-options">
            <button data-property="id" aria-pressed="false">ID</button>
            <button data-property="agent" aria-pressed="true">Agent</button>
            <button data-property="chat" aria-pressed="true">Chat</button>
            <button data-property="priority" aria-pressed="true">Priority</button>
            <button data-property="due" aria-pressed="true">Due date</button>
            <button data-property="added" aria-pressed="true">Added</button>
            <button data-property="completed" aria-pressed="true">Completed</button>
            <button data-property="details" aria-pressed="false">Details</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <p id="notice" role="status" hidden></p>
  <main id="main">
    <form id="new-task" hidden autocomplete="off">
      <span class="check"></span>
      <input id="new-title" maxlength="300" placeholder="Add a task" aria-label="New task">
    </form>
    <div id="open"></div>
    <p id="empty" hidden>All clear.</p>
    <div id="problem" hidden>
      <p></p>
      <button class="pick-folder">Choose a folder…</button>
    </div>
  </main>

  <div id="prio-menu" class="menu floating" role="menu" hidden>
    <div class="menu-label">Priority</div>
    <button role="menuitemradio" data-p="0"><span class="prio" data-p="0">P0</span>Drop everything</button>
    <button role="menuitemradio" data-p="1"><span class="prio" data-p="1">P1</span>Today</button>
    <button role="menuitemradio" data-p="2"><span class="prio" data-p="2">P2</span>Soon</button>
    <button role="menuitemradio" data-p="3"><span class="prio" data-p="3">P3</span>Whenever</button>
    <button role="menuitemradio" data-p="">None</button>
  </div>

  <div id="due-menu" class="menu floating" role="dialog" aria-label="Due date" hidden>
    <div class="cal-head">
      <button class="icon" data-nav="-1" title="Previous month"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
      <span id="cal-title"></span>
      <button class="icon" data-nav="1" title="Next month"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
    </div>
    <div id="cal-grid"></div>
    <div class="cal-quick">
      <button data-quick="0">Today</button>
      <button data-quick="1">Tomorrow</button>
      <button data-quick="clear">Clear</button>
    </div>
  </div>

  <template id="row">
    <li class="task">
      <div class="line">
        <button class="check" title="Mark done"><svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></button>
        <div class="text">
          <div class="title"><span class="title-text" role="button" tabindex="0" aria-label="Edit task title"></span></div>
          <div class="preview" hidden></div>
          <div class="sub"><span class="task-id" hidden></span><span class="src"></span><span class="due" hidden><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><span></span></span><span class="time-sub"></span></div>
        </div>
        <span class="prio" hidden></span>
        <span class="time"></span>
      </div>
      <div class="details">
        <div class="details-inner">
          <div class="details-pad">
            <p class="body" role="button" tabindex="0" aria-label="Edit task details"></p>
            <div class="subtasks" hidden>
              <div class="subtasks-head">
                <span>Subtasks</span>
                <button class="mode-chip" aria-label="Ordered subtasks" aria-pressed="false"><span class="mode-number">1</span><span class="slash">/</span><span class="mode-dot">•</span></button>
                <button class="icon add-subtask" title="Add subtask" aria-label="Add subtask"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
              </div>
              <ul class="subtask-list"></ul>
            </div>
            <div class="meta">
              <span class="actions">
                <button class="icon open-note" title="Open as sticky note" aria-label="Open as sticky note">
                  <svg viewBox="0 0 24 24"><path d="M16 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v11z"/><path d="M16 21v-5h5"/></svg>
                </button>
                <button class="icon first-subtask" title="Add subtask" aria-label="Add subtask" hidden>
                  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button class="icon set-desk" title="Put on my desk" aria-pressed="false">
                  <svg viewBox="0 0 24 24"><path d="M8 3h8l3.5 8h-15L8 3zM12 11v9M8 20h8"/></svg>
                </button>
                <button class="icon set-due" title="Set a due date" aria-haspopup="dialog">
                  <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>
                </button>
                <button class="icon set-prio" title="Priority" aria-haspopup="menu">
                  <svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
                </button>
                <button class="icon open-link" title="Back to the conversation">
                  <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                </button>
                <button class="icon delete" title="Delete task">
                  <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
                </button>
              </span>
            </div>
          </div>
        </div>
      </div>
    </li>
  </template>

  <script src="agents.js"></script>
  <script src="app.js"></script>
</body>
</html>
